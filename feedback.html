<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feedback — PullBook</title>
  <meta name="description" content="Tell us what's working, what's broken, and what you'd love to see in PullBook.">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #F5F0EB; --card: #FBF8F4; --ink: #1F1814; --ink-2: #4A4039;
      --ink-3: #8A7C70; --line: #E3DAD0; --crema: #C8855A;
      --f-sans: "Geist", system-ui, -apple-system, sans-serif;
      --f-mono: "Geist Mono", ui-monospace, monospace;
      --f-serif: "Instrument Serif", Georgia, serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--f-sans); background: var(--paper); color: var(--ink); line-height: 1.5; -webkit-font-smoothing: antialiased; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 0 24px 72px; }
    header { padding: 64px 0 32px; }
    .home { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); text-decoration: none; }
    .home:hover { color: var(--crema); }
    h1 { font-size: clamp(34px, 6vw, 48px); font-weight: 500; letter-spacing: -0.02em; margin-top: 18px; }
    h1 .serif { font-family: var(--f-serif); font-style: italic; font-weight: 400; }
    .sub { color: var(--ink-3); font-size: 15px; margin-top: 8px; }

    .form-card {
      background: var(--card); border: 1px solid var(--line); border-radius: 18px;
      padding: 8px; overflow: hidden;
    }
    .form-card iframe { display: block; width: 100%; height: 1100px; border: 0; border-radius: 12px; background: var(--card); }
    .fallback { color: var(--ink-3); font-size: 13px; margin-top: 16px; text-align: center; }
    .fallback a { color: var(--ink-2); }

    footer { text-align: center; color: var(--ink-3); font-size: 13px; padding-top: 40px; }
    footer a { color: var(--ink-2); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="home" href="./">&#8249; pullbook.app</a>
      <h1>Send <span class="serif">feedback</span></h1>
      <p class="sub">What's working, what's broken, what you wish it did. It all helps.</p>
    </header>

    <div class="form-card">
      <iframe
        src="https://docs.google.com/forms/d/e/1FAIpQLSd42-FLYIXwI2Ne1I8m0NIVMCx25VaIu5mIr3PZMFMffmnj6g/viewform?embedded=true"
        title="PullBook feedback form"
        loading="lazy">Loading the form&hellip;</iframe>
    </div>
    <p class="fallback">Form not loading? <a href="https://forms.gle/dVTqsPsDXfAvaX6h6">Open it in a new tab</a>.</p>

    <footer>© 2026 Rich Sharples · <a href="./">pullbook.app</a> · <a href="./roadmap.html">Roadmap</a></footer>
  </div>
</body>
</html>
