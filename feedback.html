<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feedback — PullBook</title>
  <meta name="description" content="Tell us what's working, what's broken, and what you'd love to see in PullBook.">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #F5F0EB;
      --card: #FBF8F4;
      --ink: #1F1814;
      --ink-2: #4A4039;
      --ink-3: #8A7C70;
      --line: #E3DAD0;
      --crema: #C8855A;
      --crema-deep: #9C6440;
      --f-sans: "Geist", system-ui, -apple-system, "Helvetica Neue", sans-serif;
      --f-mono: "Geist Mono", ui-monospace, "SF Mono", monospace;
      --f-serif: "Instrument Serif", Georgia, "Times New Roman", serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--f-sans);
      background: var(--paper);
      color: var(--ink);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 640px; margin: 0 auto; padding: 0 24px; }

    /* top nav */
    .navbar {
      position: sticky; top: 0; z-index: 20;
      background: rgba(245, 240, 235, 0.82);
      backdrop-filter: saturate(180%) blur(12px);
      -webkit-backdrop-filter: saturate(180%) blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .topnav {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px 24px; flex-wrap: wrap;
      padding-top: 14px; padding-bottom: 14px;
    }
    .topnav .brand {
      font-family: var(--f-mono); font-size: 13px; font-weight: 500;
      letter-spacing: 0.02em; color: var(--ink); text-decoration: none;
    }
    .navlinks { display: flex; gap: 22px; flex-wrap: wrap; }
    .navlinks a {
      font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--ink-3); text-decoration: none;
      transition: color .15s ease;
    }
    .navlinks a:hover { color: var(--crema); }
    .navlinks a[aria-current="page"] { color: var(--ink); }

    /* footer */
    footer { text-align: center; padding: 56px 0 64px; color: var(--ink-3); font-size: 13px; }
    footer a { color: var(--ink-2); }

    header { padding: 36px 0 40px; }
    h1 { font-size: clamp(34px, 6vw, 48px); font-weight: 500; letter-spacing: -0.02em; margin-top: 18px; }
    h1 .serif { font-family: var(--f-serif); font-style: italic; font-weight: 400; }
    .sub { color: var(--ink-3); font-size: 15px; margin-top: 8px; }

    .form-card {
      background: var(--card); border: 1px solid var(--line); border-radius: 18px;
      padding: 8px; overflow: hidden;
    }
    .form-card iframe { display: block; width: 100%; height: 1100px; border: 0; border-radius: 12px; background: var(--card); }
    .fallback { color: var(--ink-3); font-size: 13px; margin-top: 16px; text-align: center; }
    .fallback a { color: var(--ink-2); }
    .ph-badge { text-align: center; margin: 0 0 32px; }
    .ph-badge img { width: 250px; height: 54px; max-width: 100%; }
  </style>
</head>
<body>

  <div class="navbar">
    <nav class="topnav wrap">
      <a class="brand" href="./">PullBook</a>
      <div class="navlinks">
        <a href="./roadmap.html">Roadmap</a>
        <a href="./changelog.html">Changelog</a>
        <a href="./feedback.html" aria-current="page">Feedback</a>
        <a href="mailto:rich.sharples@softwhere.org">Contact</a>
      </div>
    </nav>
  </div>

<div class="wrap">
    <header>
      <h1>Send <span class="serif">feedback</span></h1>
      <p class="sub">What's working, what's broken, what you wish it did. It all helps.</p>
    </header>

    <div class="ph-badge">
      <a href="https://www.producthunt.com/products/pullbook/reviews/new?utm_source=badge-product_review&utm_medium=badge&utm_source=badge-pullbook" target="_blank" rel="noopener">
        <img src="https://api.producthunt.com/widgets/embed-image/v1/product_review.svg?product_id=1246835&theme=neutral" alt="PullBook - The espresso dial-in companion. | Product Hunt" width="250" height="54" loading="lazy" />
      </a>
    </div>

    <div class="form-card">
      <iframe
        src="https://docs.google.com/forms/d/e/1FAIpQLSd42-FLYIXwI2Ne1I8m0NIVMCx25VaIu5mIr3PZMFMffmnj6g/viewform?embedded=true"
        title="PullBook feedback form"
        loading="lazy">Loading the form&hellip;</iframe>
    </div>
    <p class="fallback">Form not loading? <a href="https://forms.gle/dVTqsPsDXfAvaX6h6">Open it in a new tab</a>.</p>
  </div>

  <footer class="wrap">
    © 2026 Rich Sharples · <a href="./roadmap.html">Roadmap</a> · <a href="./changelog.html">Changelog</a> · <a href="./feedback.html">Feedback</a> · <a href="mailto:rich.sharples@softwhere.org">Contact</a>
  </footer>

</body>
</html>
